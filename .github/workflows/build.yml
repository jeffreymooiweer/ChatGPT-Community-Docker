name: Build ChatGPT Community Docker

on:
  push:
    branches: [main, staging]
    paths-ignore: ['README.md', 'docs/**', 'upstream-state.json']
  pull_request:
    branches: [main, staging]
    # Metadata-only promotion PRs already have a full build on their exact
    # staging head. Do not request a duplicate bot-created PR workflow.
    paths-ignore: ['README.md', 'docs/**', 'upstream-state.json', 'upstream-candidate.json']
  schedule:
    - cron: '17 */6 * * *'
    - cron: '37 3 * * 0'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact staging commit prepared for validation
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: chatgpt-community-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'release' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout stable source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Discover the current signed upstream
        env:
          RESOLVE_MODE: discover
        run: bash scripts/resolve-upstream.sh

      - name: Prepare and dispatch staging candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/release.py prepare

  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      image_id: ${{ steps.export.outputs.image_id }}
      archive_sha256: ${{ steps.export.outputs.archive_sha256 }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify dispatched staging revision
        if: github.ref == 'refs/heads/staging'
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ -n "$EXPECTED_SHA" ]; then test "$EXPECTED_SHA" = "$GITHUB_SHA"; fi

      - name: Validate scripts and persistent-data migration
        run: |
          command -v ssh-keygen gpg gpgv jq
          python3 -m unittest discover -s tests -v

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve upstream
        id: upstream
        env:
          RESOLVE_MODE: ${{ github.event_name == 'pull_request' && 'discover' || 'verify-candidate' }}
        run: bash scripts/resolve-upstream.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build candidate without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          tags: chatgpt-community-ci:test
          build-args: |
            WRAPPER_SHA=${{ steps.upstream.outputs.wrapper_sha }}
            OFFICIAL_VERSION=${{ steps.upstream.outputs.official_version }}
            OFFICIAL_PATH=${{ steps.upstream.outputs.official_path }}
            OFFICIAL_SHA256=${{ steps.upstream.outputs.official_sha256 }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.upstream.outputs.official_version }}
            org.opencontainers.image.description=Single-app ChatGPT Community with experimental Remote Mobile Control
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test X11 and Wayland startup, HTTPS and restart persistence
        run: bash tests/smoke.sh chatgpt-community-ci:test

      - name: Save smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/upstream-state.json
            ${{ runner.temp }}/package.json
            upstream-candidate.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Export the successfully tested image
        id: export
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/staging'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-image"
          docker save chatgpt-community-ci:test | gzip -1 > "$RUNNER_TEMP/release-image/image.tar.gz"
          echo "image_id=$(docker image inspect chatgpt-community-ci:test --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$(sha256sum "$RUNNER_TEMP/release-image/image.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Preserve the exact image for promotion
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/staging'
        uses: actions/upload-artifact@v4
        with:
          name: tested-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-image/image.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  promote:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/staging' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      packages: write
      actions: read
      checks: read
      statuses: read
    steps:
      - name: Checkout tested staging source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download the tested image from this run
        uses: actions/download-artifact@v4
        with:
          name: tested-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-image

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge and publish only the validated staging image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ github.sha }}
          EXPECTED_IMAGE_ID: ${{ needs.build.outputs.image_id }}
          EXPECTED_ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
        run: python3 scripts/release.py promote
